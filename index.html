function library(){const a=load();return `<h2 class="section-title">My workouts</h2><div class="card"><div class="row wrap"><div style="flex:1;min-width:190px"><label class="label">New workout name</label><input id="newWorkoutName" class="input" placeholder="e.g. Hotel workout"></div><button id="createWorkout" class="btn gold">Create workout</button></div><div class="builder-list">${customWorkoutCards(a)}</div></div><h2 class="section-title">Exercise catalogue</h2><div class="card"><input id="searchLib" class="input" placeholder="Search ${CATALOG.length} exercises..."><div class="status-line">Your tailored programme stays unchanged. Catalogue exercises are only added to workouts you create.</div></div><div id="libResults">${libItems('')}</div><h2 class="section-title">Timer settings</h2><div class="card grid2"><div><label class="label">Countdown warning</label><select id="countdown" class="input"><option value="0" ${a.settings.countdown==0?'selected':''}>Off</option><option value="3" ${a.settings.countdown==3?'selected':''}>Last 3 sec</option><option value="5" ${a.settings.countdown==5?'selected':''}>Last 5 sec</option><option value="10" ${a.settings.countdown==10?'selected':''}>Last 10 sec</option></select></div><div><label class="label">Sound</label><select id="sound" class="input"><option value="on" ${a.settings.sound?'selected':''}>On</option><option value="off" ${!a.settings.sound?'selected':''}>Off</option></select></div></div><div class="notice">Keep the app open for dependable browser timer sound and vibration. Every completed set now starts its exercise rest timer, and Start rest is always available manually.</div><h2 class="section-title">Data & backup</h2><div class="card"><b>Your history belongs to you</b><p class="muted smalltxt">Back up both Graham and Louise before changing phone, clearing browser data, or moving to a new ME VS ME file. Restore brings the history into the new version.</p><div class="notice" style="margin:10px 0">${dataSummary()}</div><div class="row wrap"><button id="backupBtn" class="btn gold">⬇ Backup all data</button><label class="btn" style="cursor:pointer">⬆ Restore backup<input id="restoreInput" type="file" accept="application/json,.json" style="display:none"></label></div><p class="tiny muted" style="margin-bottom:0">V6 checks known V2/V3/V4 storage keys automatically and preserves V5 data.</p></div>`}
function libItems(q){q=(q||'').toLowerCase();return CATALOG.filter(x=>(x.n+' '+x.desc+' '+x.tech.join(' ')+' '+x.tip.join(' ')).toLowerCase().includes(q)).map(x=>`<div class="card"><div class="row"><b style="font-size:17px">${esc(x.n)}</b><span class="pill">${esc(x.reps)}</span></div><p class="muted smalltxt">${esc(x.desc)}</p><div class="library-actions"><button class="btn small gold" data-addexercise="${esc(x.n)}">+ Add to my workout</button></div><details class="tipbox"><summary>Technique & tips</summary><div style="margin-top:8px">${x.tech.map(v=>'• '+esc(v)).join('<br>')}<br><br>${x.tip.map(v=>'• '+esc(v)).join('<br>')}</div></details></div>`).join('')||'<div class="card muted">No matching exercises.</div>'}
let timer={left:0,total:0,interval:null,running:false,exercise:'',lastBeep:-1};let audioCtx=null;
function beep(freq=880,dur=.12){const s=load().settings;if(!s.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function startTimer(sec,exercise){clearInterval(timer.interval);timer={left:sec,total:sec,interval:null,running:true,exercise,lastBeep:-1};$('#timerbar').classList.add('show');timer.interval=setInterval(tickTimer,250);tickTimer()}
function tickTimer(){if(!timer.running)return;timer.left=Math.max(0,timer.left-.25);const ceil=Math.ceil(timer.left),s=load().settings;$('#timerText').textContent=`${Math.floor(ceil/60)}:${String(ceil%60).padStart(2,'0')}`;$('#timerExercise').textContent='REST • '+timer.exercise;if(s.countdown&&ceil<=s.countdown&&ceil>0&&ceil!==timer.lastBeep){timer.lastBeep=ceil;beep(720,.08);if(navigator.vibrate)navigator.vibrate(40)}if(timer.left<=0){clearInterval(timer.interval);timer.running=false;beep(1080,.35);if(navigator.vibrate)navigator.vibrate([100,70,180]);$('#timerText').textContent='GO';setTimeout(()=>$('#timerbar').classList.remove('show'),2500)}}
function primeAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function bindExtras(){
 const wc=$('#workoutChoice');if(wc)wc.onchange=()=>{const a=load(),d=a.days[state.date]||{};d.selectedWorkoutId=wc.value;delete d.sessionCompletedAt;delete d.sessionDurationSec;a.days[state.date]=d;save(a);render()};
 const up=$('#usePlanned');if(up)up.onclick=()=>{const a=load(),d=a.days[state.date]||{};d.selectedWorkoutId='day:'+weekday();a.days[state.date]=d;save(a);render()};
 document.querySelectorAll('[data-startrest]').forEach(b=>b.onclick=()=>{primeAudio();const a=load(),sec=Number((a.settings.exerciseRest||{})[b.dataset.e]||90);startTimer(sec,b.dataset.e)});
 const fw=$('#finishWorkout');if(fw)fw.onclick=()=>{const a=load(),d=a.days[state.date]||{},now=Date.now(),started=Number(d.sessionStartedAt||now);d.sessionStartedAt=started;d.sessionCompletedAt=new Date(now).toISOString();d.sessionDurationSec=Math.max(1,Math.round((now-started)/1000));a.days[state.date]=d;save(a);render()};
 const rw=$('#reopenWorkout');if(rw)rw.onclick=()=>{const a=load(),d=a.days[state.date]||{};delete d.sessionCompletedAt;delete d.sessionDurationSec;a.days[state.date]=d;save(a);render()};
 const create=$('#createWorkout');if(create)create.onclick=()=>{const name=($('#newWorkoutName').value||'').trim();if(!name)return alert('Give the workout a name first.');const a=load();a.settings.customWorkouts.push({name,exercises:[]});save(a);render()};
 document.querySelectorAll('[data-usecustom]').forEach(b=>b.onclick=()=>{const a=load(),d=a.days[state.date]||{};d.selectedWorkoutId='custom:'+b.dataset.usecustom;a.days[state.date]=d;save(a);state.tab='today';render();window.scrollTo(0,0)});
 document.querySelectorAll('[data-deletecustom]').forEach(b=>b.onclick=()=>{const a=load(),w=a.settings.customWorkouts[Number(b.dataset.deletecustom)];if(w&&confirm(`Delete ${w.name}?`)){a.settings.customWorkouts.splice(Number(b.dataset.deletecustom),1);save(a);render()}});
 const results=$('#libResults');if(results)results.onclick=e=>{const b=e.target.closest('[data-addexercise]');if(!b)return;const a=load(),ws=a.settings.customWorkouts||[];if(!ws.length)return alert('Create a workout first.');let i=0;if(ws.length>1){const answer=prompt('Add to which workout?\n'+ws.map((w,n)=>`${n+1}. ${w.name}`).join('\n'),'1');i=Number(answer)-1;if(!Number.isInteger(i)||!ws[i])return}if(!ws[i].exercises.includes(b.dataset.addexercise))ws[i].exercises.push(b.dataset.addexercise);save(a);b.textContent='✓ Added to '+ws[i].name;b.disabled=true};
}
function render(){nav();datebar();$('#profile').value=state.profile;const f={today,fuel,body,progress,library}[state.tab]||today;$('#screen').innerHTML=f();bind();bindExtras()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo(0,0)});const fields=['weight','steps','water','notes','calories','protein','carbs','fat','totalBurn','activeCalories','burnSource'];fields.forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>updateDay({[id]:e.value})});document.querySelectorAll('.bodyField').forEach(e=>e.onchange=()=>updateDay({[e.dataset.f]:e.value}));const settingMap={targetCalories:'calories',targetProtein:'protein',targetSteps:'steps',targetWater:'water',goal:'goal',targetWeight:'targetWeight'};Object.keys(settingMap).forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>updateSettings({[settingMap[id]]:e.value})});document.querySelectorAll('.setinput').forEach(e=>e.onchange=()=>{const a=load(),d=a.days[state.date]||{},er=getExerciseState(a,d,e.dataset.e),sr=er.sets[e.dataset.s]||{};sr[e.dataset.f]=e.value;er.sets[e.dataset.s]=sr;a.days[state.date]=d;save(a)});document.querySelectorAll('[data-check]').forEach(e=>e.onclick=()=>{const a=load(),d=a.days[state.date]||{},er=getExerciseState(a,d,e.dataset.e),sr=er.sets[e.dataset.s]||{};sr.done=!sr.done;er.sets[e.dataset.s]=sr;a.days[state.date]=d;save(a);if(sr.done){const secs=Number((a.settings.exerciseRest||{})[e.dataset.e]||90);startTimer(secs,e.dataset.e)}render()});document.querySelectorAll('[data-setnote]').forEach(e=>e.onclick=()=>{const a=load(),d=a.days[state.date]||{},er=getExerciseState(a,d,e.dataset.e),sr=er.sets[e.dataset.s]||{},v=prompt('Set note',sr.note||'');if(v!==null){sr.note=v;er.sets[e.dataset.s]=sr;a.days[state.date]=d;save(a);render()}});document.querySelectorAll('.exerciseNote').forEach(e=>e.onchange=()=>{const a=load();a.persistentNotes[e.dataset.e]=e.value;save(a)});document.querySelectorAll('[data-rest]').forEach(e=>e.onclick=()=>{const a=load();a.settings.exerciseRest=a.settings.exerciseRest||{};a.settings.exerciseRest[e.dataset.e]=Number(e.dataset.rest);save(a);render()});document.querySelectorAll('[data-customrest]').forEach(e=>e.onclick=()=>{const cur=(load().settings.exerciseRest||{})[e.dataset.e]||90,v=prompt('Rest time in seconds',cur);if(v!==null&&Number(v)>0){const a=load();a.settings.exerciseRest[e.dataset.e]=Math.round(Number(v));save(a);render()}});document.querySelectorAll('.photoInput').forEach(inp=>inp.onchange=ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=650,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.68),a=load(),d=a.days[state.date]||{};d.photos=d.photos||{};d.photos[inp.dataset.pose]=data;a.days[state.date]=d;if(!save(a))alert('Photo could not be saved because browser storage is full.');render()};img.src=reader.result};reader.readAsDataURL(file)});const sr=$('#searchLib');if(sr)sr.oninput=()=>$('#libResults').innerHTML=libItems(sr.value);const cd=$('#countdown');if(cd)cd.onchange=()=>updateSettings({countdown:Number(cd.value)});const snd=$('#sound');if(snd)snd.onchange=()=>updateSettings({sound:snd.value==='on'});const bb=$('#backupBtn');if(bb)bb.onclick=exportBackup;const ri=$('#restoreInput');if(ri)ri.onchange=e=>importBackupFile(e.target.files&&e.target.files[0]);document.querySelectorAll('[data-chartmetric]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-chartmetric]').forEach(x=>x.classList.remove('gold'));b.classList.add('gold');$('#bodyChart').innerHTML=miniChart(metricSeries(b.dataset.chartmetric,28),b.dataset.label,b.dataset.chartmetric==='muscleMass'?'kg':b.dataset.chartmetric==='visceral'?'':'%')})}
$('#screen').addEventListener('click',e=>{const b=e.target.closest('[data-check]');if(!b||b.classList.contains('done'))return;primeAudio();const a=load(),d=a.days[state.date]||{};if(!d.sessionStartedAt)d.sessionStartedAt=Date.now();a.days[state.date]=d;save(a)},true);
$('#profile').onchange=e=>{state.profile=e.target.value;render()};$('#prevDay').onclick=()=>{const d=parseIso(state.date);d.setDate(d.getDate()-1);state.date=iso(d);render()};$('#nextDay').onclick=()=>{const d=parseIso(state.date);d.setDate(d.getDate()+1);state.date=iso(d);render()};$('#minus15').onclick=()=>{timer.left=Math.max(0,timer.left-15);tickTimer()};$('#plus15').onclick=()=>{timer.left+=15;timer.total+=15;tickTimer()};$('#timerPause').onclick=()=>{timer.running=!timer.running;$('#timerPause').textContent=timer.running?'Pause':'Resume';tickTimer()};$('#timerClose').onclick=()=>{clearInterval(timer.interval);timer.running=false;$('#timerbar').classList.remove('show')};window.addEventListener('error',e=>{console.error(e)});render();
})();
</script>
