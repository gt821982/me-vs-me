function findPreviousExercise(name,before){const a=load();const keys=Object.keys(a.days).filter(k=>k<before).sort().reverse();for(const k of keys){const er=a.days[k]?.workout?.[name];if(er){const vals=Object.values(er.sets||{}).filter(s=>s.kg||s.reps).map(s=>`${s.kg||'?'}×${s.reps||'?'}`);if(vals.length)return vals.slice(0,3).join(' / ')+(vals.length>3?'…':'')}}return ''}
function fuel(){const d=dayData(),a=load(),s=a.settings;return `<h2 class="section-title">Fuel</h2><div class="card"><div class="row"><div><div class="muted">Calories</div><div class="metric">${num(d.calories)}<span class="muted" style="font-size:14px"> / ${s.calories}</span></div></div><div class="gold">${pct(num(d.calories),s.calories)}%</div></div><div class="progress"><i style="width:${pct(num(d.calories),s.calories)}%"></i></div></div><div class="card grid2"><div><label class="label">Calories</label><input id="calories" class="input" inputmode="numeric" value="${esc(d.calories||'')}"></div><div><label class="label">Protein g</label><input id="protein" class="input" inputmode="numeric" value="${esc(d.protein||'')}"></div><div><label class="label">Carbs g</label><input id="carbs" class="input" inputmode="numeric" value="${esc(d.carbs||'')}"></div><div><label class="label">Fat g</label><input id="fat" class="input" inputmode="numeric" value="${esc(d.fat||'')}"></div></div><h2 class="section-title">Targets</h2><div class="card grid2"><div><label class="label">Calories/day</label><input id="targetCalories" class="input" inputmode="numeric" value="${s.calories}"></div><div><label class="label">Protein/day g</label><input id="targetProtein" class="input" inputmode="numeric" value="${s.protein}"></div><div><label class="label">Steps/day</label><input id="targetSteps" class="input" inputmode="numeric" value="${s.steps}"></div><div><label class="label">Water/day L</label><input id="targetWater" class="input" inputmode="decimal" value="${s.water}"></div></div><div class="notice">Wearable calorie-burn data is intentionally kept separate from food calories so the app does not accidentally double-count step calories already included by Samsung Health.</div>`}
function body(){const d=dayData(),a=load(),s=a.settings,photos=d.photos||{};return `<h2 class="section-title">Body composition</h2><div class="notice">Enter the figures from your Renpho/scale reading. Daily BIA values can fluctuate, so the Progress tab emphasises weekly trends rather than one reading.</div><div class="card"><div class="metric-grid">${BODY_FIELDS.slice(0,13).map(f=>`<div class="metric-card"><div class="n">${esc(f[1])}</div><div class="v">${d[f[0]]?esc(d[f[0]]):'—'}${d[f[0]]&&f[2]?` <span class="tiny muted">${f[2]}</span>`:''}</div></div>`).join('')}</div></div><h2 class="section-title">Edit today's reading</h2><div class="card grid2">${BODY_FIELDS.map(f=>`<div><label class="label">${esc(f[1])}${f[2]?' ('+f[2]+')':''}</label><input class="input bodyField" data-f="${f[0]}" inputmode="decimal" value="${esc(d[f[0]]||'')}"></div>`).join('')}</div><h2 class="section-title">Progress photos</h2><div class="card"><div class="photo-grid">${['front','side','back'].map(p=>`<label><div class="photo-box" id="photo_${p}">${photos[p]?`<img src="${photos[p]}">`:`${p.toUpperCase()}<br>Tap to add`}</div><input type="file" accept="image/*" capture="environment" class="hidden photoInput" data-pose="${p}"></label>`).join('')}</div></div><h2 class="section-title">Goal</h2><div class="card grid2"><div><label class="label">Goal mode</label><select id="goal" class="input">${['Fat Loss','Recomposition','Muscle Gain','General Fitness'].map(g=>`<option ${s.goal===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label class="label">Target weight kg</label><input id="targetWeight" class="input" inputmode="decimal" value="${esc(s.targetWeight||'')}"></div></div>`}
function rangeDays(n,end=state.date){const a=load(),out=[];let d=parseIso(end);for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=iso(x);out.push([k,a.days[k]||{}])}return out}
function metricSeries(field,n=14){return rangeDays(n).map(([k,d])=>[k,num(d[field])]).filter(x=>x[1]>0)}
function miniChart(series,label,unit){if(series.length<2)return `<div class="muted smalltxt" style="padding:20px 0">Log at least two days to build the ${esc(label)} chart.</div>`;const w=620,h=145,p=18,vals=series.map(x=>x[1]),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;const pts=series.map((x,i)=>{const xx=p+i*(w-2*p)/(series.length-1),yy=h-p-(x[1]-min)*(h-2*p)/span;return [xx,yy,x[1]]});return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="chartgrid" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><line class="chartgrid" x1="${p}" y1="${p}" x2="${w-p}" y2="${p}"/><polyline class="chartline" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>${pts.map(p=>`<circle class="chartpoint" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</svg><div class="row tiny muted"><span>${esc(series[0][0].slice(5))}</span><span>${esc(label)}: ${vals[vals.length-1].toFixed(unit==='kg'?1:0)}${esc(unit)}</span><span>${esc(series[series.length-1][0].slice(5))}</span></div>`}
function completedSession(d){return !!(d.workout&&Object.values(d.workout).some(er=>Object.values(er.sets||{}).some(s=>s.done)))}
function progress(){const a=load(),s=a.settings,last7=rangeDays(7),prev7=(()=>{const e=parseIso(state.date);e.setDate(e.getDate()-7);return rangeDays(7,iso(e))})();const vals=(rows,f)=>rows.map(x=>num(x[1][f])).filter(v=>v>0);const w=vals(last7,'weight'),pw=vals(prev7,'weight'),st=vals(last7,'steps'),burn=vals(last7,'totalBurn'),cal=vals(last7,'calories'),pro=vals(last7,'protein');const wavg=avg(w),pwavg=avg(pw),wdiff=(wavg&&pwavg)?wavg-pwavg:0;let planned=0,done=0;last7.forEach(([k,d])=>{if((PROGRAM[weekday(k)]||{}).ex?.length){planned++;if(d.sessionCompleted||completedSession(d))done++}});const train=pct(done,planned||1),proteinAd=last7.filter(x=>num(x[1].protein)>=s.protein*.9).length/7*100,stepAd=last7.filter(x=>num(x[1].steps)>=s.steps*.9).length/7*100,score=Math.round(train*.45+proteinAd*.30+stepAd*.25);const weeklyBurn=burn.reduce((x,y)=>x+y,0),weeklySteps=st.reduce((x,y)=>x+y,0),weekVol=weeklyVolume(last7),prevVol=weeklyVolume(prev7),volDiff=prevVol?((weekVol-prevVol)/prevVol*100):0;let msg='Keep logging daily. Weekly averages become more useful as the data fills in.';if(wdiff<-.2&&train>=75)msg='Weight trend is moving down while training adherence is solid. That is exactly the pattern you want during fat loss.';else if(score>=85)msg='Excellent adherence this week. Resist the urge to change too much — repeat what is working.';else if(score>=65)msg='Good week. Your easiest gains are in tightening the one or two habits that missed most often.';return `<h2 class="section-title">Progress</h2><div class="card"><div class="score" style="--score:${score}"><strong>${score}</strong></div><div style="text-align:center;margin-top:9px"><b>ME VS ME SCORE</b><div class="muted tiny">rolling 7 days</div></div></div><div class="grid2"><div class="kpi"><span class="label">Avg weight</span><b>${wavg?wavg.toFixed(2)+' kg':'—'}</b><span class="tiny ${wdiff<0?'good':wdiff>0?'bad':'muted'}">${pwavg?(wdiff>0?'+':'')+wdiff.toFixed(2)+' kg vs prior week':'Need prior week'}</span></div><div class="kpi"><span class="label">Weekly lifting volume</span><b>${weekVol?Math.round(weekVol).toLocaleString()+' kg':'—'}</b><span class="tiny ${volDiff>0?'good':volDiff<0?'muted':'muted'}">${prevVol?(volDiff>=0?'+':'')+volDiff.toFixed(1)+'% vs prior week':'Build a prior week baseline'}</span></div><div class="kpi"><span class="label">Avg steps</span><b>${st.length?Math.round(avg(st)).toLocaleString():'—'}</b><span class="tiny muted">${weeklySteps?weeklySteps.toLocaleString()+' total':'No total yet'}</span></div><div class="kpi"><span class="label">Avg calories burned</span><b>${burn.length?Math.round(avg(burn)).toLocaleString():'—'}</b><span class="tiny muted">${weeklyBurn?weeklyBurn.toLocaleString()+' week total':'No total yet'}</span></div><div class="kpi"><span class="label">Training</span><b>${done}/${planned}</b><span class="tiny muted">${train}% adherence</span></div><div class="kpi"><span class="label">Avg calories eaten</span><b>${cal.length?Math.round(avg(cal)).toLocaleString():'—'}</b></div><div class="kpi"><span class="label">Avg protein</span><b>${pro.length?Math.round(avg(pro))+' g':'—'}</b></div><div class="kpi"><span class="label">Completed sessions</span><b>${last7.filter(x=>x[1].sessionCompleted).length}</b><span class="tiny muted">Finish Workout confirmations</span></div></div><div class="card" style="margin-top:13px"><b>This week's read</b><p class="muted" style="line-height:1.55;margin-bottom:0">${esc(msg)}</p></div><h2 class="section-title">Daily lifting volume</h2><div class="card">${miniChart(last7.map(([k,d])=>[k,sessionVolume(d).total]),'Volume',' kg')}</div><h2 class="section-title">Weight trend</h2><div class="card">${miniChart(metricSeries('weight',14),'Weight','kg')}</div><h2 class="section-title">Calories burned</h2><div class="card">${miniChart(metricSeries('totalBurn',14),'Burn',' kcal')}</div><h2 class="section-title">Steps</h2><div class="card">${miniChart(metricSeries('steps',14),'Steps','')}</div><h2 class="section-title">Body composition trends</h2><div class="card"><div class="seg">${[['bodyfat','Body fat'],['muscleMass','Muscle mass'],['skeletalMuscle','Skeletal muscle'],['visceral','Visceral fat'],['bodyWater','Body water']].map((x,i)=>`<button class="btn small ${i===0?'gold':''}" data-chartmetric="${x[0]}" data-label="${x[1]}">${x[1]}</button>`).join('')}</div><div id="bodyChart" style="margin-top:10px">${miniChart(metricSeries('bodyfat',28),'Body fat','%')}</div></div><h2 class="section-title">Daily consistency</h2><div class="card"><div class="weekgrid">${last7.map(([k,d])=>{const dd=parseIso(k),ok=d.sessionCompleted||completedSession(d)||weekday(k)==='Saturday'||weekday(k)==='Sunday';return `<div class="daydot ${ok?'done':''} ${k===iso(new Date())?'today':''}"><b>${dd.toLocaleDateString('en-GB',{weekday:'narrow'})}</b><br>${dd.getDate()}<br>${d.weight?'⚖':''}${d.steps?'👣':''}${d.sessionCompleted?'✓':''}</div>`}).join('')}</div></div>`}
function library(){return `<h2 class="section-title">Exercise Library</h2><div class="card"><input id="searchLib" class="input" placeholder="Search exercise..."></div><div id="libResults">${libItems('')}</div>${customWorkoutBuilder()}<h2 class="section-title">Timer settings</h2><div class="card grid2"><div><label class="label">Countdown warning</label><select id="countdown" class="input"><option value="0" ${load().settings.countdown==0?'selected':''}>Off</option><option value="3" ${load().settings.countdown==3?'selected':''}>Last 3 sec</option><option value="5" ${load().settings.countdown==5?'selected':''}>Last 5 sec</option><option value="10" ${load().settings.countdown==10?'selected':''}>Last 10 sec</option></select></div><div><label class="label">Sound</label><select id="sound" class="input"><option value="on" ${load().settings.sound?'selected':''}>On</option><option value="off" ${!load().settings.sound?'selected':''}>Off</option></select></div></div><div class="notice">The standalone browser version can beep and vibrate while open. A future native Android version can make background/lock-screen timer alerts more reliable and pull Samsung Health data automatically.</div><h2 class="section-title">Install ME VS ME</h2><div class="card"><b>Use it like an app</b><p class="muted smalltxt">Install ME VS ME to your home screen for a full-screen app experience and offline access after the first visit.</p><button id="installAppBtn" class="btn gold" style="width:100%">Install ME VS ME</button><p id="installHint" class="tiny muted" style="margin-bottom:0">If the install button is unavailable, use your browser menu → Add to Home screen.</p></div><h2 class="section-title">Data & backup</h2><div class="card"><b>Your history belongs to you</b><p class="muted smalltxt">Back up both Graham and Louise before changing phone, clearing browser data, or moving to a new ME VS ME file. Restore brings the history into the new version.</p><div class="notice" style="margin:10px 0">${dataSu function libItems(q){q=(q||'').toLowerCase();return LIB.filter(x=>(x.n+' '+x.desc+' '+x.tech.join(' ')+' '+x.tip.join(' ')).toLowerCase().includes(q)).map(x=>`<div class="card"><div class="row"><b style="font-size:17px">${esc(x.n)}</b><span class="pill">${esc(x.reps)}</span></div><p class="muted smalltxt">${esc(x.desc)}</p><details class="tipbox"><summary>Technique & tips</summary><div style="margin-top:8px">${x.tech.map(v=>'• '+esc(v)).join('<br>')}<br><br>${x.tip.map(v=>'• '+esc(v)).join('<br>')}</div></details></div>`).join('')||'<div class="card muted">No matching exercises.</div>'}
let timer={left:0,total:0,interval:null,running:false,exercise:'',lastBeep:-1};let audioCtx=null;
function beep(freq=880,dur=.12){const s=load().settings;if(!s.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function startTimer(sec,exercise){clearInterval(timer.interval);timer={left:sec,total:sec,interval:null,running:true,exercise,lastBeep:-1};$('#timerbar').classList.add('show');timer.interval=setInterval(tickTimer,250);tickTimer()}
function tickTimer(){if(!timer.running)return;timer.left=Math.max(0,timer.left-.25);const ceil=Math.ceil(timer.left),s=load().settings;$('#timerText').textContent=`${Math.floor(ceil/60)}:${String(ceil%60).padStart(2,'0')}`;$('#timerExercise').textContent='REST • '+timer.exercise;if(s.countdown&&ceil<=s.countdown&&ceil>0&&ceil!==timer.lastBeep){timer.lastBeep=ceil;beep(720,.08);if(navigator.vibrate)navigator.vibrate(40)}if(timer.left<=0){clearInterval(timer.interval);timer.running=false;beep(1080,.35);if(navigator.vibrate)navigator.vibrate([100,70,180]);$('#timerText').textContent='GO';setTimeout(()=>$('#timerbar').classList.remove('show'),2500)}}
function render(){if(sessionClockInterval){clearInterval(sessionClockInterval);sessionClockInterval=null}nav();datebar();$('#profile').value=state.profile;const f={today,fuel,body,progress,library}[state.tab]||today;$('#screen').innerHTML=f();bind();if(state.tab==='today'){const d=dayData();if(d.sessionStart&&!d.sessionEnd){sessionClockInterval=setInterval(()=>{const el=$('#sessionClock');if(el)el.textContent=fmtDuration(elapsedSeconds(dayData()))},1000)}}}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo(0,0)});const fields=['weight','steps','water','notes','calories','protein','carbs','fat','totalBurn','activeCalories','burnSource'];fields.forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>updateDay({[id]:e.value})});const sw=$('#selectedWorkout');if(sw)sw.onchange=()=>{const a=load(),d=a.days[state.date]||{};d.selectedWorkout=sw.value;a.days[state.date]=d;save(a);render()};const fw=$('#finishWorkout');if(fw)fw.onclick=finishWorkout;const rw=$('#reopenWorkout');if(rw)rw.onclick=resetFinish;document.querySelectorAll('.bodyField').forEach(e=>e.onchange=()=>updateDay({[e.dataset.f]:e.value}));const settingMap={targetCalories:'calories',targetProtein:'protein',targetSteps:'steps',targetWater:'water',goal:'goal',targetWeight:'targetWeight'};Object.keys(settingMap).forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>updateSettings({[settingMap[id]]:e.value})});document.querySelectorAll('.setinput').forEach(e=>e.onchange=()=>{const a=load(),d=a.days[state.date]||{},er=getExerciseState(a,d,e.dataset.e),sr=er.sets[e.dataset.s]||{};sr[e.dataset.f]=e.value;er.sets[e.dataset.s]=sr;a.days[state.date]=d;save(a)});document.querySelectorAll('[data-check]').forEach(e=>e.onclick=()=>completeSet(e));document.querySelectorAll('[data-setnote]').forEach(e=>e.onclick=()=>{const a=load(),d=a.days[state.date]||{},er=getExerciseState(a,d,e.dataset.e),sr=er.sets[e.dataset.s]||{},v=prompt('Set note',sr.note||'');if(v!==null){sr.note=v;er.sets[e.dataset.s]=sr;a.days[state.date]=d;save(a);render()}});document.querySelectorAll('.exerciseNote').forEach(e=>e.onchange=()=>{const a=load();a.persistentNotes[e.dataset.e]=e.value;save(a)});document.querySelectorAll('[data-rest]').forEach(e=>e.onclick=()=>{const a=load();a.settings.exerciseRest=a.settings.exerciseRest||{};a.settings.exerciseRest[e.dataset.e]=Number(e.dataset.rest);save(a);render()});document.querySelectorAll('[data-customrest]').forEach(e=>e.onclick=()=>{const cur=(load().settings.exerciseRest||{})[e.dataset.e]||90,v=prompt('Rest time in seconds',cur);if(v!==null&&Number(v)>0){const a=load();a.settings.exerciseRest[e.dataset.e]=Math.round(Number(v));save(a);render()}});document.querySelectorAll('.photoInput').forEach(inp=>inp.onchange=ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=650,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.68),a=load(),d=a.days[state.date]||{};d.photos=d.photos||{};d.photos[inp.dataset.pose]=data;a.days[state.date]=d;if(!save(a))alert('Photo could not be saved because browser storage is full.');render()};img.src=reader.result};reader.readAsDataURL(file)});const sr=$('#searchLib');if(sr)sr.oninput=()=>$('#libResults').innerHTML=libItems(sr.value);const bs=$('#builderSearch');if(bs)bs.oninput=()=>$('#builderExerciseList').innerHTML=builderItems(bs.value);const scw=$('#saveCustomWorkout');if(scw)scw.onclick=()=>{const name=($('#customWorkoutName').value||'').trim(),chosen=[...document.querySelectorAll('.builderCheck:checked')].map(x=>x.value);if(!name)return alert('Give the workout a name.');if(!chosen.length)return alert('Choose at least one exercise.');const a=load();a.settings.customWorkouts=a.settings.customWorkouts||[];if(a.settings.customWorkouts.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('A custom workout with that name already exists.');a.settings.customWorkouts.push({name,exercises:chosen,cardio:'Custom session'});save(a);render()};document.querySelectorAll('[data-deletecustom]').forEach(b=>b.onclick=()=>{const a=load();a.settings.customWorkouts=a.settings.customWorkouts||[];a.settings.customWorkouts.splice(Number(b.dataset.deletecustom),1);save(a);render()});const cd=$('#countdown');if(cd)cd.onchange=()=>updateSettings({countdown:Number(cd.value)});const snd=$('#sound');if(snd)snd.onchange=()=>updateSettings({sound:snd.value==='on'});const ib=$('#installAppBtn');if(ib){if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){ib.textContent='Installed ✓';ib.disabled=true}else{ib.onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;render()}else{const h=$('#installHint');if(h)h.textContent='Open the browser menu and choose Add to Home screen / Install app.'}}}};const bb=$('#backupBtn');if(bb)bb.onclick=exportBackup;const ri=$('#restoreInput');if(ri)ri.onchange=e=>importBackupFile(e.target.files&&e.target.files[0]);document.querySelectorAll('[data-chartmetric]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-chartmetric]').forEach(x=>x.classList.remove('gold'));b.classList.add('gold');$('#bodyChart').innerHTML=miniChart(metricSeries(b.dataset.chartmetric,28),b.dataset.label,b.dataset.chartmetric==='muscleMass'?'kg':b.dataset.chartmetric==='visceral'?'':'%')})}
$('#profile').onchange=e=>{state.profile=e.target.value;render()};$('#prevDay').onclick=()=>{const d=parseIso(state.date);d.setDate(d.getDate()-1);state.date=iso(d);render()};$('#nextDay').onclick=()=>{const d=parseIso(state.date);d.setDate(d.getDate()+1);state.date=iso(d);render()};$('#minus15').onclick=()=>{timer.left=Math.max(0,timer.left-15);tickTimer()};$('#plus15').onclick=()=>{timer.left+=15;timer.total+=15;tickTimer()};$('#timerPause').onclick=()=>{timer.running=!timer.running;$('#timerPause').textContent=timer.running?'Pause':'Resume';tickTimer()};$('#timerClose').onclick=()=>{clearInterval(timer.interval);timer.running=false;$('#timerbar').classList.remove('show')};window.addEventListener('error',e=>{console.error(e)});render();
